<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掲示板集 - Retro Web Archive</title>
    <style>
        :root {
            --main-red: #DF0000;
            --accent-yellow: #FFDF5F;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background: #f8f4e9;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: var(--main-red);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
        }

        /* 掲示板リスト */
        .list-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 1.5rem;
        }

        .list-container h2 {
            color: var(--main-red);
            margin-bottom: 1rem;
            border-bottom: 3px solid var(--main-red);
            padding-bottom: 0.5rem;
        }

        ul {
            list-style: none;
        }

        li {
            margin: 0.8rem 0;
        }

        a {
            color: #0066cc;
            text-decoration: none;
            font-size: 1.05rem;
        }

        a:hover {
            text-decoration: underline;
            color: #ff6600;
        }

        /* バス部分 */
        #bus {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        /* スマホ対応 */
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
            #bus {
                bottom: 1rem;
                transform: translateX(-50%) scale(0.85);
            }
        }
    </style>
</head>
<body>

    <header>
