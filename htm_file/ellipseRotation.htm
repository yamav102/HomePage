<style type ="text/css">
#space{

	margin-left:auto;
	background-color:darkblue;
	z-index:1;
	width:30%;
	height:250px;

	background-repeat:repeat;
	background-position:0 0;
}#space span{
	color:yellow;
	font-size:30%;
}#earth{
	position:absolute;
	z-index:2;
}
</style>
<script type="text/javascript">
<!--//
	var deg = 0;//角度
	var pi = Math.PI;//円周率
	var x, y; //地球の座標
	var a = 1, b = 1; //楕円の長軸、短軸の比
        var a2, b2, x2;

	function EarthRotation(){

		var earthImg = document.getElementById('earth');
		var spaceDiv = document.getElementById('space');

		with(spaceDiv){
			//中心座標
			var axisX = offsetLeft + offsetWidth / 2;
			var axisY = offsetTop + offsetHeight / 2;
		}

		deg++;
		if(deg >= 360){
			deg = 0;
		}
		// 楕円の長軸、短軸の比
		if(b <= a){
			//b =- 0.1;
          	}

                a++;
                if(a >= 1){
			a = 0;
		}
		a = 1; b = 0.5;
		*/
		//半径を宇宙幅の3分の1にしてみた
		var r = spaceDiv.offsetWidth * 1 / 3;

		//中心のｘ座標が 0 だった場合の地球のｘ座標
		var x0 = r * Math.cos(deg / 180 * pi) * a;
				
		/*-----------------------------------------
		中心座標分 x 座標を補正.
		画像の座標は左肩の点で指定する為、
		地球の幅 / 2 分右に表示されてしまう。
		座標をマイナス補正する。
		-----------------------------------------*/
		x = axisX + x0 - earthImg.offsetWidth / 2;

		//y座標
//		a2 = Math.pow(r * a, 2);
//		b2 = Math.pow(r * b, 2);
		a2 = Math.pow(a, 2);
		b2 = Math.pow(b, 2);

		x2 = Math.pow(x, 2);

		if(deg > 180){

			y = axisY + Math.sqrt(b2 - b2 * x0 / a2);

		}else{
			//document.writeln("axisY: " + axisY + "<br />");
			y = axisY - Math.sqrt(b2 - b2 * x0 / a2);
			
			alert(y);
                        //SQRT($B$3^2-($B$3^2*C7^2/$B$2^2))
/*
			alert('x2='+x2);
			alert('axisX='+axisX);
			alert('r='+r);
			alert('axisX/r='+axisX/r);
			alert('x2-axisX/r='+ x2+axisX/r);
			alert('b2='+b2);
			alert('x2='+x2);
			alert('a2='+a2);
*/
			//document.writeln("y= "+ y + ":" + " x2 = " + x2 + "<br />");

		}

		/*-----------------------------------------
		画像の座標は左肩の点で指定する為、
		地球の幅 / 2 分下に表示されてしまう。
		座標をマイナス補正する。
		-----------------------------------------*/		
		y = y - earthImg.offsetHeight / 2;		

		with(earthImg){
			style.left = x;
			style.top = y;
		}

		setTimeout("EarthRotation()", 10);//ミリ秒
	}
//-->
</script>
<body onload="EarthRotation();">
<div id = "earth">
